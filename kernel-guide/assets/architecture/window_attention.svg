<rect width="100%" height="100%" fill="white"/>
<text x="32" y="40" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600" text-anchor="start">Window attention · one 8 × 8 neighborhood at a time</text>
<text x="32" y="70" fill="#52647c" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">C ∈ {32, 64, 128, 256, 512} · h = C/32 heads · 32 channels per head · S = number of padded windows</text>
