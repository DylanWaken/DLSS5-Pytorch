<text x="600.0" y="267" fill="#2563ab" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Separate Q, K and V</text>
<text x="600.0" y="291" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">H × W × h × 3 × 32 → three fields</text>
