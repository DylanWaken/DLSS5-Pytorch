<text x="600.0" y="642" fill="#2563ab" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Pad + partition K</text>
<text x="600.0" y="666" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">Zero pad, then 8 × 8 windows</text>
<text x="600.0" y="689" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">S × h × 64 × 32</text>
<rect x="855" y="615" width="290" height="89" rx="13" fill="#edf5ff" stroke="#2563ab" stroke-width="1.7"/>
<text x="1000.0" y="642" fill="#2563ab" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Pad + partition V</text>
<text x="1000.0" y="666" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">Zero pad, then 8 × 8 windows</text>
<text x="1000.0" y="689" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">S × h × 64 × 32</text>
<path d="M 200.0,559 L 200.0,615" fill="none" stroke="#2563ab" stroke-width="2" marker-end="url(#arrow-flow)"/>
<path d="M 600.0,559 L 600.0,615" fill="none" stroke="#2563ab" stroke-width="2" marker-end="url(#arrow-flow)"/>
<path d="M 1000.0,421 L 1000.0,615" fill="none" stroke="#2563ab" stroke-width="2" marker-end="url(#arrow-flow)"/>
<text x="1017" y="512" fill="#52647c" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">V bypasses normalization</text>
<rect x="455" y="755" width="690" height="66" rx="13" fill="#f3eefb" stroke="#7750aa" stroke-width="1.7"/>
<text x="800.0" y="782" fill="#7750aa" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Reorder K and V together</text>
<text x="800.0" y="806" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">Kπ = K[π]; Vπ = V[π] · each S × h × 64 × 32</text>
<path d="M 600.0,704 L 600,755" fill="none" stroke="#7750aa" stroke-width="2" marker-end="url(#arrow-attention)"/>
<path d="M 1000.0,704 L 1000,755" fill="none" stroke="#7750aa" stroke-width="2" marker-end="url(#arrow-attention)"/>
<rect x="55" y="865" width="490" height="66" rx="13" fill="#f3eefb" stroke="#7750aa" stroke-width="1.7"/>
<text x="300.0" y="892" fill="#7750aa" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Dot product Q · Kπᵀ</text>
<text x="300.0" y="916" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">S × h × 64 queries × 64 keys</text>
<path d="M 200.0,704 L 200,820 L 230,820 L 230,865" fill="none" stroke="#2563ab" stroke-width="2" marker-end="url(#arrow-flow)"/>
<path d="M 455,788.0 L 395,788 L 395,865" fill="none" stroke="#7750aa" stroke-width="2" marker-end="url(#arrow-attention)"/>
<circle cx="300" cy="995" r="21" fill="#fff5e5" stroke="#b86910" stroke-width="2"/>
<text x="300" y="1003" fill="#b86910" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" text-anchor="middle">+</text>
<path d="M 300.0,931 L 300.0,974" fill="none" stroke="#2563ab" stroke-width="2" marker-end="url(#arrow-flow)"/>
<rect x="660" y="960" width="450" height="66" rx="4" fill="#f0fbf8" stroke="#087f80" stroke-width="1.7"/>
<text x="885.0" y="987" fill="#087f80" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Learned relative-position bias B</text>
<text x="885.0" y="1011" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">h × 64 natural queries × 64 physical keys</text>
<path d="M 660,993.0 L 321,995.0" fill="none" stroke="#b86910" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-skip)"/>
<rect x="55" y="1055" width="490" height="66" rx="13" fill="#f3eefb" stroke="#7750aa" stroke-width="1.7"/>
<text x="300.0" y="1082" fill="#7750aa" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Surrogate exponential E = f(scores + B)</text>
<text x="300.0" y="1106" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">S × h × 64 × 64</text>
<path d="M 300.0,1016 L 300.0,1055" fill="none" stroke="#2563ab" stroke-width="2" marker-end="url(#arrow-flow)"/>
<rect x="650" y="1200" width="460" height="66" rx="13" fill="#f3eefb" stroke="#7750aa" stroke-width="1.7"/>
<text x="880.0" y="1227" fill="#7750aa" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Row sum d = Σkey E</text>
<text x="880.0" y="1251" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">S × h × 64 × 1</text>
<rect x="55" y="1260" width="490" height="89" rx="13" fill="#f3eefb" stroke="#7750aa" stroke-width="1.7"/>
<text x="300.0" y="1287" fill="#7750aa" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Normalize each query row: P = E / d</text>
<text x="300.0" y="1311" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">Publish to the working precision</text>
<text x="300.0" y="1334" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">S × h × 64 × 64</text>
<path d="M 300.0,1121 L 300,1160 L 880,1160 L 880.0,1200" fill="none" stroke="#2563ab" stroke-width="2" marker-end="url(#arrow-flow)"/>
<path d="M 300.0,1121 L 300.0,1260" fill="none" stroke="#2563ab" stroke-width="2" marker-end="url(#arrow-flow)"/>
<path d="M 650,1233.0 L 595,1233 L 595,1304.5 L 545,1304.5" fill="none" stroke="#2563ab" stroke-width="2" marker-end="url(#arrow-flow)"/>
<rect x="55" y="1400" width="490" height="66" rx="13" fill="#f3eefb" stroke="#7750aa" stroke-width="1.7"/>
<text x="300.0" y="1427" fill="#7750aa" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Weighted values: P · Vπ</text>
<text x="300.0" y="1451" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">S × h × 64 × 32</text>
<path d="M 300.0,1349 L 300.0,1400" fill="none" stroke="#2563ab" stroke-width="2" marker-end="url(#arrow-flow)"/>
<path d="M 1145,788.0 L 1170,788 L 1170,1433 L 545,1433.0" fill="none" stroke="#b86910" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-skip)"/>
<text x="650" y="1415" fill="#b86910" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Vπ bypasses scores and row normalization</text>
<rect x="55" y="1520" width="490" height="89" rx="13" fill="#edf5ff" stroke="#2563ab" stroke-width="1.7"/>
<text x="300.0" y="1547" fill="#2563ab" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Merge windows + crop padding</text>
<text x="300.0" y="1571" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">S × h × 64 × 32 → H × W × C</text>
<text x="300.0" y="1594" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">Crop away top / left shifted padding</text>
<path d="M 300.0,1466 L 300.0,1520" fill="none" stroke="#2563ab" stroke-width="2" marker-end="url(#arrow-flow)"/>
<text x="650" y="1328" fill="#52647c" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Each output token combines 64 value vectors.</text>
<text x="650" y="1352" fill="#52647c" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">The denominator sums keys within its own window.</text>
<text x="650" y="1530" fill="#52647c" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Q rows keep natural spatial order.</text>
<text x="650" y="1554" fill="#52647c" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">The same π reorders key columns and value rows.</text>
<text x="650" y="1578" fill="#52647c" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">The unpacked bias already uses that key order.</text>
<text x="55" y="1665" fill="#52647c" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Boundary windows also contain zero-padded slots; local normalization includes all 64 slots.</text>
<text x="32" y="1711" fill="#52647c" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">Logical tensor flow · shapes omit batch unless shown · operations may be fused in CUDA</text>
</svg>
