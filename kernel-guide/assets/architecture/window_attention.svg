<text x="200.0" y="642" fill="#2563ab" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Pad + partition Q</text>
<text x="200.0" y="666" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">Zero pad, then 8 × 8 windows</text>
<text x="200.0" y="689" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">S × h × 64 × 32</text>
