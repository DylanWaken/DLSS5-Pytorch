<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1730" viewBox="0 0 1200 1730" role="img" aria-labelledby="title desc">
<title id="title">Window attention · one 8 × 8 neighborhood at a time</title><desc id="desc">C ∈ {32, 64, 128, 256, 512} · h = C/32 heads · 32 channels per head · S = number of padded windows</desc>
