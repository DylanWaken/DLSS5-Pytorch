<text x="200.0" y="521" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">L2 norm over 32 channels</text>
<text x="200.0" y="544" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">× learned head_scale[h]</text>
<rect x="455" y="470" width="290" height="89" rx="13" fill="#f3eefb" stroke="#7750aa" stroke-width="1.7"/>
<text x="600.0" y="497" fill="#7750aa" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Normalize K</text>
<text x="600.0" y="521" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">L2 norm over 32 channels</text>
<text x="600.0" y="544" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">one vector per pixel / head</text>
<path d="M 200.0,421 L 200.0,470" fill="none" stroke="#2563ab" stroke-width="2" marker-end="url(#arrow-flow)"/>
