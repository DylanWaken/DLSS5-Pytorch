<text x="600.0" y="382" fill="#087f80" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Key K</text>
<text x="600.0" y="406" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">H × W × h × 32</text>
<path d="M 600.0,306 L 600,330 L 600,330 L 600.0,355" fill="none" stroke="#2563ab" stroke-width="2" marker-end="url(#arrow-flow)"/>
