 x="24" y="651" text-anchor="start" style="font-family:Segoe UI,Arial,sans-serif;font-size:18px;fill:#183347;font-weight:650">Working-format inputs do not imply working-format scratch: intermediate split sums remain Half.</text><text x="24" y="690" text-anchor="start" style="font-family:Segoe UI,Arial,sans-serif;font-size:16px;fill:#183347;font-weight:400">Final split: normalize Q/K, apply Q scale, publish separate Q/K/V layouts.</text><text x="24" y="766" text-anchor="start" style="font-family:Segoe UI,Arial,sans-serif;font-size:15px;fill:#546b7b;font-weight:400">Native mode uses the source completion-counter protocol; OrderedSplit mode uses launch order. These boxes are dependencies, not GPU issue cycles.</text></svg>