<?xml version="1.0" encoding="UTF-8"?>
<svg data-kernel="small_global_attention_chained_c1024_fp8" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="fig-small_global_attention_chained_c1024_fp8-publication-map-title fig-small_global_attention_chained_c1024_fp8-publication-map-desc" style="min-width:1100px;width:1200px;height:auto"><title id="fig-small_global_attention_chained_c1024_fp8-publication-map-title">FP16 and FP8 uint4 publication maps for query 17 channel 9</title><desc id="fig-small_global_attention_chained_c1024_fp8-publication-map-desc">Two packed uint4 strips showing the exact word and byte occupied by output channel 9 for FP16 and FP8, with the PublishWindowChunk selection order.</desc><text x="28" y="30" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:21px;font-weight:600;fill:#17384a">Publication packing: why channel 9 lands on a different word and byte per precision</text><text x="28" y="53" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#476273">The final uint4 is produced by PublishWindowChunk. The pack order changes because FP8 consumes two N8 groups per word.</text><text x="28" y="96" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:16px;font-weight:600;fill:#17384a">FP16: half-precision columns, one N8 group per two uint4 words</text><rect x="28" y="116" width="250" height="56" rx="5" fill="#dce8f5" stroke="#8aa0ad"/><text x="38" y="136" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">word 0</text><text x="38" y="158" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">c0 q17 | c1 q17</text><rect x="298" y="116" width="250" height="56" rx="5" fill="#dce8f5" stroke="#8aa0ad"/><text x="308" y="136" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">word 1</text><text x="308" y="158" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">c0 q25 | c1 q25</text><rect x="568" y="116" width="250" height="56" rx="5" fill="#ffe0b3" stroke="#8aa0ad"/><text x="578" y="136" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">word 2</text><text x="578" y="158" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">c8 q17 | c9 q17</text><rect x="838" y="116" width="250" height="56" rx="5" fill="#ffe0b3" stroke="#8aa0ad"/><text x="848" y="136" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">word 3</text><text x="848" y="158" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">c8 q25 | c9 q25</text><rect x="574" y="116" width="238" height="56" fill="none" stroke="#a95847" stroke-width="3"/><text x="28" y="196" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#7a2f22">uint4 base 40,000 B. Channel 9 is the high Half of word 2: byte offset 8 + 2 = 10, absolute 40,010 B.</text><text x="28" y="220" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#476273">Byte offsets inside the vector: word0 0..3, word1 4..7, word2 8..11, word3 12..15. The next chunk adds 512 B.</text><text x="28" y="282" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:16px;font-weight:600;fill:#17384a">FP8: E4M3 columns, two N8 groups merged into one word</text><rect x="28" y="302" width="250" height="74" rx="5" fill="#ffe0b3" stroke="#8aa0ad"/><text x="38" y="322" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">word 0 q17</text><rect x="38" y="334" width="50" height="28" fill="#ffffff" stroke="#b6c4ce"/><text x="63" y="353" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#17384a">c0</text><rect x="95" y="334" width="50" height="28" fill="#ffffff" stroke="#b6c4ce"/><text x="120" y="353" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#17384a">c1</text><rect x="152" y="334" width="50" height="28" fill="#ffffff" stroke="#b6c4ce"/><text x="177" y="353" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#17384a">c8</text><rect x="209" y="334" width="50" height="28" fill="#ffffff" stroke="#b6c4ce"/><text x="234" y="353" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#17384a">c9</text><rect x="298" y="302" width="250" height="74" rx="5" fill="#ffe0b3" stroke="#8aa0ad"/><text x="308" y="322" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">word 1 q25</text><rect x="308" y="334" width="50" height="28" fill="#ffffff" stroke="#b6c4ce"/><text x="333" y="353" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#17384a">c0</text><rect x="365" y="334" width="50" height="28" fill="#ffffff" stroke="#b6c4ce"/><text x="390" y="353" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#17384a">c1</text><rect x="422" y="334" width="50" height="28" fill="#ffffff" stroke="#b6c4ce"/><text x="447" y="353" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#17384a">c8</text><rect x="479" y="334" width="50" height="28" fill="#ffffff" stroke="#b6c4ce"/><text x="504" y="353" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#17384a">c9</text><rect x="568" y="302" width="250" height="74" rx="5" fill="#e3f2eb" stroke="#8aa0ad"/><text x="578" y="322" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">word 2 q17</text><rect x="578" y="334" width="50" height="28" fill="#ffffff" stroke="#b6c4ce"/><text x="603" y="353" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#17384a">c16</text><rect x="635" y="334" width="50" height="28" fill="#ffffff" stroke="#b6c4ce"/><text x="660" y="353" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#17384a">c17</text><rect x="692" y="334" width="50" height="28" fill="#ffffff" stroke="#b6c4ce"/><text x="717" y="353" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#17384a">c24</text><rect x="749" y="334" width="50" height="28" fill="#ffffff" stroke="#b6c4ce"/><text x="774" y="353" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#17384a">c25</text><rect x="838" y="302" width="250" height="74" rx="5" fill="#e3f2eb" stroke="#8aa0ad"/><text x="848" y="322" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">word 3 q25</text><rect x="848" y="334" width="50" height="28" fill="#ffffff" stroke="#b6c4ce"/><text x="873" y="353" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#17384a">c16</text><rect x="905" y="334" width="50" height="28" fill="#ffffff" stroke="#b6c4ce"/><text x="930" y="353" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#17384a">c17</text><rect x="962" y="334" width="50" height="28" fill="#ffffff" stroke="#b6c4ce"/><text x="987" y="353" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#17384a">c24</text><rect x="1019" y="334" width="50" height="28" fill="#ffffff" stroke="#b6c4ce"/><text x="1044" y="353" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#17384a">c25</text><rect x="209" y="302" width="50" height="74" fill="none" stroke="#a95847" stroke-width="3"/><text x="28" y="404" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#7a2f22">uint4 base 20,032 B. Channel 9 is byte 3 of word 0 after PackHalfPairsE4(pair0, pair1): absolute 20,035 B.</text><text x="28" y="428" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#476273">The first two words cover row halves 0 and 1 for channels 0/1 and 8/9; the last two words move to groups 2/3 (channels 16/17 and 24/25).</text><rect x="28" y="470" width="1146" height="118" rx="9" fill="#e4f4ed" stroke="#247666" stroke-width="1.5"/><text x="40" y="494" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">Published fragment, not the accumulator layout</text><text x="40" y="516" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#284653">FP16: PublishWindowChunk&lt;false&gt; selects r_Pair[2*chunk + r_Half][r_RowHalf] into four words.</text><text x="40" y="535" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#284653">FP8: PublishWindowChunk&lt;true&gt; selects r_Pair[4*chunk + 2*r_Half][r_RowHalf] and its successor, then PackHalfPairsE4.</text><text x="40" y="554" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#284653">The same 64 FP32 numerator values feed this pack, but the scalar channel-to-byte map differs. The CPU fixture checks both maps.</text><text x="28" y="626" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#7a2f22">The FP8 path first rounds the normalised FP32 to Half in PackFloatColumnsHalf2, then rounds Half to E4M3 in PublishFourE4.</text><text x="28" y="650" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#476273">The pad-clear loop writes zero uint32 words at (r_ColumnTile*2 + r_Half)*4; it does not change this real-row pack order.</text></svg>
