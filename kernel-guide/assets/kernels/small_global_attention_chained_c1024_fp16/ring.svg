<?xml version="1.0" encoding="UTF-8"?>
<svg data-kernel="small_global_attention_chained_c1024_fp16" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" role="img" aria-labelledby="fig-small_global_attention_chained_c1024_fp16-ring-title fig-small_global_attention_chained_c1024_fp16-ring-desc" style="min-width:1100px;width:1200px;height:auto"><title id="fig-small_global_attention_chained_c1024_fp16-ring-title">Two-stage K/V ring and persistent FP32 accumulator lifetime</title><desc id="fig-small_global_attention_chained_c1024_fp16-ring-desc">A source-order schedule diagram showing barrier initialization, predecessor waits, Q load, prefill of two key tiles, steady-state compute plus two-ahead refill, and final drain.</desc><text x="28" y="30" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:21px;font-weight:600;fill:#17384a">Execution ring: prefill two K/V tiles, consume, refill two ahead, wait for the next tile</text><text x="28" y="53" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#476273">Source order only. Warp/CTA launch order is unspecified; dependency counters do not create a fixed timeline.</text><rect x="28" y="88" width="330" height="218" rx="9" fill="#fff0d6" stroke="#a57425" stroke-width="1.5"/><text x="40" y="112" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">Shared ring (two matched stages)</text><text x="40" y="134" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">K0 at byte 0, V0 at 8,192</text><text x="40" y="153" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">K1 at 4,096, V1 at 12,288</text><text x="40" y="172" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">barriers at 16,384 and +8</text><text x="40" y="191" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">each K/V slot: 4,096 B</text><text x="40" y="210" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">slot = keyTile &amp; 1</text><rect x="378" y="88" width="330" height="218" rx="9" fill="#e9efff" stroke="#5a6fa4" stroke-width="1.5"/><text x="390" y="112" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">Producer / consumer protocol</text><text x="390" y="134" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">init two mbarriers; CTA sync</text><text x="390" y="153" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">WaitPredecessor for Q/K/V groups</text><text x="390" y="172" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">load Q once into 4 x QueryChunks fragments</text><text x="390" y="191" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">prefill key tiles 0 and 1</text><text x="390" y="210" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">wait stage 0 before the first score tile</text><rect x="728" y="88" width="442" height="218" rx="9" fill="#e4f4ed" stroke="#247666" stroke-width="1.5"/><text x="740" y="112" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">Persistent FP32 state starts here</text><text x="740" y="134" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">u[4][4][4] = 64 FP32 per lane</text><text x="740" y="153" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">D[2] = 2 FP32 per lane</text><text x="740" y="172" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">both survive every key tile</text><text x="740" y="191" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">K/V/score/E fragments do not</text><text x="740" y="210" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">final inverse is produced after the loop</text><rect x="28" y="380" width="118" height="78" rx="7" fill="#e4f4ed" stroke="#247666"/><text x="36" y="404" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:600;fill:#17384a">init</text><text x="36" y="425" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#476273">barriers</text><text x="36" y="442" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#476273">CTA sync</text><line x1="146" y1="419" x2="157" y2="419" stroke="#536a79" stroke-width="2.1" stroke-linecap="round"/><polygon points="157,419 146.0,414.0 146.0,424.0" fill="#536a79"/><rect x="158" y="380" width="118" height="78" rx="7" fill="#e4f4ed" stroke="#247666"/><text x="166" y="404" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:600;fill:#17384a">wait QKV</text><text x="166" y="425" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#476273">counter</text><text x="166" y="442" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#476273">+ CTA sync</text><line x1="276" y1="419" x2="287" y2="419" stroke="#536a79" stroke-width="2.1" stroke-linecap="round"/><polygon points="287,419 276.0,414.0 276.0,424.0" fill="#536a79"/><rect x="288" y="380" width="118" height="78" rx="7" fill="#e4f4ed" stroke="#247666"/><text x="296" y="404" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:600;fill:#17384a">Q load</text><text x="296" y="425" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#476273">once</text><line x1="406" y1="419" x2="417" y2="419" stroke="#536a79" stroke-width="2.1" stroke-linecap="round"/><polygon points="417,419 406.0,414.0 406.0,424.0" fill="#536a79"/><rect x="418" y="380" width="118" height="78" rx="7" fill="#e4f4ed" stroke="#247666"/><text x="426" y="404" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:600;fill:#17384a">prefill 0</text><text x="426" y="425" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#476273">stage 0</text><line x1="536" y1="419" x2="547" y2="419" stroke="#536a79" stroke-width="2.1" stroke-linecap="round"/><polygon points="547,419 536.0,414.0 536.0,424.0" fill="#536a79"/><rect x="548" y="380" width="118" height="78" rx="7" fill="#e4f4ed" stroke="#247666"/><text x="556" y="404" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:600;fill:#17384a">prefill 1</text><text x="556" y="425" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#476273">stage 1</text><line x1="666" y1="419" x2="677" y2="419" stroke="#536a79" stroke-width="2.1" stroke-linecap="round"/><polygon points="677,419 666.0,414.0 666.0,424.0" fill="#536a79"/><rect x="678" y="380" width="118" height="78" rx="7" fill="#e4f4ed" stroke="#247666"/><text x="686" y="404" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:600;fill:#17384a">wait 0</text><text x="686" y="425" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#476273">arrive/wait</text><line x1="796" y1="419" x2="807" y2="419" stroke="#536a79" stroke-width="2.1" stroke-linecap="round"/><polygon points="807,419 796.0,414.0 796.0,424.0" fill="#536a79"/><rect x="808" y="380" width="118" height="78" rx="7" fill="#fff0d6" stroke="#a57425"/><text x="816" y="404" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:600;fill:#17384a">compute j</text><text x="816" y="425" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#476273">K,V -&gt; E -&gt; u</text><line x1="926" y1="419" x2="937" y2="419" stroke="#536a79" stroke-width="2.1" stroke-linecap="round"/><polygon points="937,419 926.0,414.0 926.0,424.0" fill="#536a79"/><rect x="938" y="380" width="118" height="78" rx="7" fill="#fff0d6" stroke="#a57425"/><text x="946" y="404" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:600;fill:#17384a">refill j+2</text><text x="946" y="425" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#476273">retired slot</text><line x1="1056" y1="419" x2="1067" y2="419" stroke="#536a79" stroke-width="2.1" stroke-linecap="round"/><polygon points="1067,419 1056.0,414.0 1056.0,424.0" fill="#536a79"/><rect x="1068" y="380" width="118" height="78" rx="7" fill="#e4f4ed" stroke="#247666"/><text x="1076" y="404" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:600;fill:#17384a">wait j+1</text><text x="1076" y="425" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#476273">next slot</text><text x="28" y="492" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#476273">Steady state: compute tile j, then refill the just-retired slot with j+2, then wait for j+1. The refill target is (j+2) &amp; 1 = j &amp; 1,</text><text x="28" y="514" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#476273">so it overwrites the current slot only after its K and V have been read into registers. Slot parity alone is not readiness; each stage has its own barrier.</text><rect x="28" y="544" width="550" height="190" rx="9" fill="#e9efff" stroke="#5a6fa4" stroke-width="1.5"/><text x="40" y="568" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">What the wait protects</text><text x="40" y="590" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">Q/K/V groups: predecessor completion counters</text><text x="40" y="609" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">stage j: K and V asynchronous copies complete</text><text x="40" y="628" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">CTA barrier: visibility for every participating thread</text><text x="40" y="647" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">counter wait is lane 0/warp 0; the CTA barrier follows</text><rect x="600" y="544" width="570" height="190" rx="9" fill="#ffe6e0" stroke="#a95847" stroke-width="1.5"/><text x="612" y="568" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">What is not claimed</text><text x="612" y="590" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">no fixed warp or CTA launch order</text><text x="612" y="609" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">no measured overlap or stall time</text><text x="612" y="628" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">no promise that the bulk copy uses L1</text><text x="612" y="647" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">no performance conclusion from this source order</text><text x="28" y="766" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#7a2f22">At the final tile there is no nonexistent refill and no next-stage wait. Tail clearing follows all fragment stores; completion counters are released last.</text></svg>
