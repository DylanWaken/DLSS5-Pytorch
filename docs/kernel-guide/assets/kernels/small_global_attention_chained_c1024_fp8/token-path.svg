<?xml version="1.0" encoding="UTF-8"?>
<svg data-kernel="small_global_attention_chained_c1024_fp8" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1150" width="1200" height="1150" role="img" aria-labelledby="fig-small_global_attention_chained_c1024_fp8-token-path-title fig-small_global_attention_chained_c1024_fp8-token-path-desc" style="min-width:1100px;width:1200px;height:auto"><title id="fig-small_global_attention_chained_c1024_fp8-token-path-title">Query 17 and key 0 through attention to output channel 9</title><desc id="fig-small_global_attention_chained_c1024_fp8-token-path-desc">Q bypasses shared memory. K/V enter shared then separate register fragments. QK over reduction channels produces E indexed by query and key. E forks into FP32 PV and FP32 denominator reduction. Both feed normalization and the exact output byte.</desc><text x="28" y="30" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:21px;font-weight:600;fill:#17384a">Trace q17 / head 7 / key k0 / output c9: four different indices</text><text x="28" y="54" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:400;fill:#476273">Score axis = query x key. Output axis = query x channel. Global output channel = 7*32+9 = 233.</text><rect x="28" y="90" width="350" height="150" rx="9" fill="#e9efff" stroke="#5a6fa4" stroke-width="1.5"/><text x="40" y="114" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">1. Q(q17, head 7, reduction d)</text><text x="40" y="136" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">group 1, query tile 1, warp 0, lane 4</text><text x="40" y="155" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">chunk 0 vector base = 20,032 B</text><text x="40" y="174" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">__ldca: global -&gt; Q registers</text><text x="40" y="193" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">16 B = 16 E4M3 values</text><text x="40" y="212" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">Q stays in registers across key tiles</text><rect x="410" y="90" width="360" height="150" rx="9" fill="#fff0d6" stroke="#a57425" stroke-width="1.5"/><text x="422" y="114" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">2. K/V global panels for key tile 0</text><text x="422" y="136" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">K group 0, head 7, chunk 0</text><text x="422" y="155" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">K panel base = 3,584 B</text><text x="422" y="174" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">V group 0, head 7: base 7,168 B</text><text x="422" y="193" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">V was transposed by the QKV producer</text><text x="422" y="212" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">bulk copy uses the stage barrier</text><rect x="802" y="90" width="370" height="150" rx="9" fill="#e4f4ed" stroke="#247666" stroke-width="1.5"/><text x="814" y="114" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">3. Shared -&gt; K and V registers</text><text x="814" y="136" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">stage = keyTile &amp; 1; slot = 2,048 B</text><text x="814" y="155" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">lane vector: slot base + lane*16</text><text x="814" y="174" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">K/V panel offsets are multiples of 512 B</text><text x="814" y="193" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">lane 4 starts at bank 16; no XOR</text><text x="814" y="212" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">Q does not pass through shared</text><line x1="770" y1="165" x2="802" y2="165" stroke="#536a79" stroke-width="2.1" stroke-linecap="round"/><polygon points="802,165 791.0,160.0 791.0,170.0" fill="#536a79"/><rect x="28" y="310" width="350" height="150" rx="9" fill="#e9efff" stroke="#5a6fa4" stroke-width="1.5"/><text x="40" y="334" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">4. Score S(q17,k0), reduced over d</text><text x="40" y="356" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">lane 4, query tile 1, local row 1</text><text x="40" y="375" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">N8 KEY tile 0, row-half 0, low Half</text><text x="40" y="394" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">Q(q17,d) x K(k0,d), sum over d</text><text x="40" y="413" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">QK accumulator remains Half</text><text x="40" y="432" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">output channel c9 is not a key index</text><rect x="410" y="310" width="360" height="150" rx="9" fill="#ffe6e0" stroke="#a95847" stroke-width="1.5"/><text x="422" y="334" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">5. E(q17,k0), still Half</text><text x="422" y="356" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">native affine -&gt; clamp -&gt; packed shift</text><text x="422" y="375" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">range 0.0040283203125 .. 1.640625</text><text x="422" y="394" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">zero score maps to E0 = 0.083984375</text><text x="422" y="413" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">each key contributes to TWO paths</text><text x="422" y="432" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">no row-max softmax transformation</text><line x1="190" y1="240" x2="190" y2="310" stroke="#536a79" stroke-width="2.1" stroke-linecap="round"/><polygon points="190,310 195.0,299.0 185.0,299.0" fill="#536a79"/><polyline points="802,205 790,205 790,277 350,277" fill="none" stroke="#5a6fa4" stroke-width="2.1"/><line x1="350" y1="277" x2="350" y2="310" stroke="#5a6fa4" stroke-width="2.1" stroke-linecap="round"/><polygon points="350,310 355.0,299.0 345.0,299.0" fill="#5a6fa4"/><text x="540" y="270" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#5a6fa4">K fragment -&gt; score</text><line x1="378" y1="385" x2="410" y2="385" stroke="#536a79" stroke-width="2.1" stroke-linecap="round"/><polygon points="410,385 399.0,380.0 399.0,390.0" fill="#536a79"/><rect x="410" y="570" width="360" height="150" rx="9" fill="#fff0d6" stroke="#a57425" stroke-width="1.5"/><text x="422" y="594" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">6a. P(q17,k0) x V(k0,c9)</text><text x="422" y="616" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">P = E4M3(E); D sums original Half E</text><text x="422" y="635" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">transposed V supplies key k0, channel c9</text><text x="422" y="654" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">lane 4: u[1][1][1] is FP32</text><text x="422" y="673" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">PV MMA accumulates each key prefix</text><text x="422" y="692" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">repeat for all 34 streamed key tiles</text><rect x="802" y="570" width="370" height="150" rx="9" fill="#e4f4ed" stroke="#247666" stroke-width="1.5"/><text x="814" y="594" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">6b. D(q17): sum original Half E</text><text x="814" y="616" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">each Half widens BEFORE any addition</text><text x="814" y="635" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">q17 partials: lanes 4,5,6,7, local index 2</text><text x="814" y="654" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">16 keys/source -&gt; 64 keys/tile</text><text x="814" y="673" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">lane 17 gathers; carries FP32 D[0]</text><text x="814" y="692" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">D[1] in lane 17 belongs to q49</text><line x1="540" y1="460" x2="540" y2="570" stroke="#a57425" stroke-width="2.1" stroke-linecap="round"/><polygon points="540,570 545.0,559.0 535.0,559.0" fill="#a57425"/><text x="550" y="505" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#a57425">P operand</text><polyline points="770,385 980,385" fill="none" stroke="#247666" stroke-width="2.1"/><line x1="980" y1="385" x2="980" y2="570" stroke="#247666" stroke-width="2.1" stroke-linecap="round"/><polygon points="980,570 985.0,559.0 975.0,559.0" fill="#247666"/><text x="990" y="415" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#247666">original Half E</text><polyline points="1172,205 1185,205 1185,532 740,532" fill="none" stroke="#a57425" stroke-width="2.1"/><line x1="740" y1="532" x2="740" y2="570" stroke="#a57425" stroke-width="2.1" stroke-linecap="round"/><polygon points="740,570 745.0,559.0 735.0,559.0" fill="#a57425"/><text x="817" y="525" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#a57425">V fragment -&gt; PV (bypasses score)</text><rect x="28" y="570" width="350" height="150" rx="9" fill="#eef2f5" stroke="#6b7f8c" stroke-width="1.5"/><text x="40" y="594" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">Storage contract, not a cycle trace</text><text x="40" y="616" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">global memory may be served by L2/L1</text><text x="40" y="635" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">shared addresses are explicit</text><text x="40" y="654" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">Q / K / V / E / u / D use registers</text><text x="40" y="673" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">compiler-selected state may spill</text><text x="40" y="692" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">compiled local/spill cost: see validation</text><rect x="410" y="835" width="360" height="150" rx="9" fill="#e4f4ed" stroke="#247666" stroke-width="1.5"/><text x="422" y="859" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">7. FP32 normalization, then pack</text><text x="422" y="881" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">subtract 16*E0 = 1.34375 from D</text><text x="422" y="900" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">clamp, ApproxRcp; lane 17 -&gt; lane 4</text><text x="422" y="919" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">u[1][1][1] times the q17 inverse</text><text x="422" y="938" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">PackFloatColumnsHalf2 rounds to Half</text><text x="422" y="957" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">then Half -&gt; E4M3 before the store</text><rect x="802" y="835" width="370" height="150" rx="9" fill="#e9efff" stroke="#5a6fa4" stroke-width="1.5"/><text x="814" y="859" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">8. Publish q17 / head 7 / c9</text><text x="814" y="881" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">16-byte output vector base = 20,032 B</text><text x="814" y="900" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">c9 scalar starts at byte 20,035</text><text x="814" y="919" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">word 0 byte 3 (byte +3)</text><text x="814" y="938" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">16-byte no-allocate vector store</text><text x="814" y="957" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">tail zero -&gt; CTA barrier -&gt; release</text><line x1="500" y1="720" x2="500" y2="835" stroke="#a57425" stroke-width="2.1" stroke-linecap="round"/><polygon points="500,835 505.0,824.0 495.0,824.0" fill="#a57425"/><text x="510" y="766" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#a57425">FP32 u</text><polyline points="980,720 980,789 700,789" fill="none" stroke="#247666" stroke-width="2.1"/><line x1="700" y1="789" x2="700" y2="835" stroke="#247666" stroke-width="2.1" stroke-linecap="round"/><polygon points="700,835 705.0,824.0 695.0,824.0" fill="#247666"/><text x="800" y="781" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#247666">FP32 D(q17)</text><line x1="770" y1="910" x2="802" y2="910" stroke="#536a79" stroke-width="2.1" stroke-linecap="round"/><polygon points="802,910 791.0,905.0 791.0,915.0" fill="#536a79"/><rect x="28" y="1015" width="1144" height="112" rx="9" fill="#eef2f5" stroke="#6b7f8c" stroke-width="1.5"/><text x="40" y="1039" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">Keep the two reductions and two coordinate systems separate</text><text x="40" y="1061" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#284653">QK reduces over the 32 head channels d to produce E(q,k); PV reduces over keys k to produce output y(q,c).</text><text x="40" y="1080" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#284653">E forks: original Half terms build D; PV consumes E4M3(E). D is never an operand for PV.</text><text x="40" y="1099" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#284653">The 2,160 model positions include spatial padding. Only the extra 16 key-stream positions get the E0 correction.</text></svg>
