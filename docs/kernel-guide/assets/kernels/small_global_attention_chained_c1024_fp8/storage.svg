<svg data-kernel="small_global_attention_chained_c1024_fp8" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="fig-small_global_attention_chained_c1024_fp8-resources-title fig-small_global_attention_chained_c1024_fp8-resources-desc" style="min-width:1100px;width:1200px;height:auto"><title id="fig-small_global_attention_chained_c1024_fp8-resources-title">Resource and lifetime budget for the persistent FP32 state</title><desc id="fig-small_global_attention_chained_c1024_fp8-resources-desc">Lifetime bars for Q, K, V, score/E, the 64-value FP32 numerator, the two FP32 denominators and the final inverse state, plus shared and register budget tables.</desc><text x="28" y="30" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:21px;font-weight:600;fill:#17384a">Resource budget before implementation: persistent bytes and short-lived state</text><text x="28" y="53" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#476273">Logical live values per lane and per CTA. First derive the budget; compiled allocation is checked in section 6.</text><text x="258" y="112" text-anchor="end" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#284653">Q in registers</text><rect x="270.0" y="94" width="880.0" height="26" rx="4" fill="#e9efff" stroke="#5a6fa4"/><text x="280" y="112" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">16 words/lane</text><text x="258" y="146" text-anchor="end" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#284653">K tile</text><rect x="270.0" y="128" width="880.0" height="26" rx="4" fill="#eef2f5" stroke="#6b7f8c"/><text x="280" y="146" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">8 uint4/lane FP16; 4 FP8</text><text x="258" y="180" text-anchor="end" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#284653">V tile</text><rect x="270.0" y="162" width="880.0" height="26" rx="4" fill="#fff0d6" stroke="#a57425"/><text x="280" y="180" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">8 uint4/lane FP16; 4 FP8</text><text x="258" y="214" text-anchor="end" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#284653">score/E tile</text><rect x="270.0" y="196" width="880.0" height="26" rx="4" fill="#ffe6e0" stroke="#a95847"/><text x="280" y="214" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">64 uint32 words/lane</text><text x="258" y="248" text-anchor="end" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#284653">u numerator</text><rect x="270.0" y="230" width="880.0" height="26" rx="4" fill="#fff0d6" stroke="#a57425"/><text x="280" y="248" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">64 FP32/lane</text><text x="258" y="282" text-anchor="end" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#284653">D denominator</text><rect x="270.0" y="264" width="880.0" height="26" rx="4" fill="#e4f4ed" stroke="#247666"/><text x="280" y="282" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">2 FP32/lane</text><text x="258" y="316" text-anchor="end" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#284653">inverse + output</text><rect x="1124.1" y="298" width="25.9" height="26" rx="4" fill="#e9efff" stroke="#5a6fa4"/><text x="280" y="316" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">2 inverse words, 1 fragment</text><text x="270.0" y="392" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#5b7180">0</text><text x="295.88235294117646" y="392" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#5b7180">1</text><text x="477.05882352941177" y="392" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#5b7180">8</text><text x="684.1176470588235" y="392" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#5b7180">16</text><text x="891.1764705882352" y="392" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#5b7180">24</text><text x="1124.1176470588234" y="392" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#5b7180">33</text><text x="1150.0" y="392" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#5b7180">34</text><text x="710.0" y="414" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#5b7180">key-tile index (34 tiles of 64 keys; logical lifetime, not measured cycles)</text><rect x="28" y="446" width="555" height="196" rx="9" fill="#fff0d6" stroke="#a57425" stroke-width="1.5"/><text x="40" y="470" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">Shared allocation: 8,208 bytes per CTA</text><text x="40" y="492" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">K0/K1: 2,048 x 1 = 2,048 B each</text><text x="40" y="511" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">V0/V1: 2,048 x 1 = 2,048 B each</text><text x="40" y="530" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">two 8-byte barriers</text><text x="40" y="549" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">no explicit XOR swizzle; 16 B/lane panels</text><text x="40" y="568" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">static shared is a source declaration, not occupancy</text><rect x="608" y="446" width="562" height="196" rx="9" fill="#e4f4ed" stroke="#247666" stroke-width="1.5"/><text x="620" y="470" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">Persistent values per CTA (logical)</text><text x="620" y="492" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">64 FP32 u + 2 FP32 D = 66 words/lane</text><text x="620" y="511" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">128 threads x 66 x 4 = 33,792 B</text><text x="620" y="530" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">legacy Half body: 16,896 B</text><text x="620" y="549" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">delta: 16,896 B, not compiler register delta</text><text x="620" y="568" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">transient float2 reduction tree is additional</text><rect x="28" y="662" width="1146" height="112" rx="9" fill="#ffe6e0" stroke="#a95847" stroke-width="1.5"/><text x="40" y="686" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">Declared source cap versus measured allocation</text><text x="40" y="708" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">extern &quot;C&quot; __global__ __maxnreg__(208): a cap, not an allocation and not a register count.</text><text x="40" y="727" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">Transient state includes 4 local float2 + 4 gathered float2 + 2 query sums + 2 inverse words.</text><text x="40" y="746" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">Measured allocation and compiler spill sizes appear in section 6; achieved occupancy needs NCU.</text><text x="28" y="804" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#7a2f22">The source declares 66 persistent FP32 words per lane; this counts persistent state only. Temporaries add live values, and some values may spill.</text></svg>
