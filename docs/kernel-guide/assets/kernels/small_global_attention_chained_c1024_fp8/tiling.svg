<?xml version="1.0" encoding="UTF-8"?>
<svg data-kernel="small_global_attention_chained_c1024_fp8" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" role="img" aria-labelledby="fig-small_global_attention_chained_c1024_fp8-cta-title fig-small_global_attention_chained_c1024_fp8-cta-desc" style="min-width:1100px;width:1200px;height:auto"><title id="fig-small_global_attention_chained_c1024_fp8-cta-title">CTA tile, query subdivision and the 64-key K/V ring</title><desc id="fig-small_global_attention_chained_c1024_fp8-cta-desc">A per-head 2160 by 2160 model matrix inside 2304 by 2176 executed query/key positions, divided into 256-query CTA rows and 64-key columns. Grey bands mark query and key tails; the matrix is never allocated.</desc><text x="28" y="30" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:21px;font-weight:600;fill:#17384a">CTA subdivision: one head, 256 queries, 64-key streaming tiles</text><text x="28" y="53" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#476273">grid = (32 heads, ceil(T/256) = 9 query blocks); block = (32 lanes, 4 warps). Query block 0 is the q17 example.</text><text x="251.0" y="69" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#5b7180">key index</text><text x="48" y="81" text-anchor="end" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#5b7180">q</text><text x="56.0" y="84" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#5b7180">0</text><text x="147.76470588235293" y="84" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#5b7180">512</text><text x="239.52941176470588" y="84" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#5b7180">1024</text><text x="331.29411764705884" y="84" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#5b7180">1536</text><text x="446.0" y="84" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#5b7180">2176</text><rect x="56" y="90" width="390" height="390" fill="#f6f8fa" stroke="#8aa0ad"/><rect x="56" y="455.62" width="390" height="24.38" fill="#d7dfe6"/><rect x="443.13" y="90" width="2.87" height="390" fill="#b8c7d3"/><line x1="56" y1="133.3" x2="446" y2="133.3" stroke="#c8d3da"/><text x="48" y="137.33333333333334" text-anchor="end" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#5b7180">256</text><line x1="56" y1="176.7" x2="446" y2="176.7" stroke="#c8d3da"/><text x="48" y="180.66666666666669" text-anchor="end" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#5b7180">512</text><line x1="56" y1="220.0" x2="446" y2="220.0" stroke="#c8d3da"/><text x="48" y="224.0" text-anchor="end" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#5b7180">768</text><line x1="56" y1="263.3" x2="446" y2="263.3" stroke="#c8d3da"/><text x="48" y="267.33333333333337" text-anchor="end" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#5b7180">1024</text><line x1="56" y1="306.7" x2="446" y2="306.7" stroke="#c8d3da"/><text x="48" y="310.66666666666663" text-anchor="end" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#5b7180">1280</text><line x1="56" y1="350.0" x2="446" y2="350.0" stroke="#c8d3da"/><text x="48" y="354.0" text-anchor="end" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#5b7180">1536</text><line x1="56" y1="393.3" x2="446" y2="393.3" stroke="#c8d3da"/><text x="48" y="397.3333333333333" text-anchor="end" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#5b7180">1792</text><line x1="56" y1="436.7" x2="446" y2="436.7" stroke="#c8d3da"/><text x="48" y="440.6666666666667" text-anchor="end" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#5b7180">2048</text><line x1="67.5" y1="90" x2="67.5" y2="480" stroke="#dde4e8"/><line x1="113.4" y1="90" x2="113.4" y2="480" stroke="#dde4e8"/><line x1="159.2" y1="90" x2="159.2" y2="480" stroke="#dde4e8"/><line x1="205.1" y1="90" x2="205.1" y2="480" stroke="#dde4e8"/><line x1="251.0" y1="90" x2="251.0" y2="480" stroke="#dde4e8"/><line x1="296.9" y1="90" x2="296.9" y2="480" stroke="#dde4e8"/><line x1="342.8" y1="90" x2="342.8" y2="480" stroke="#dde4e8"/><line x1="388.6" y1="90" x2="388.6" y2="480" stroke="#dde4e8"/><line x1="434.5" y1="90" x2="434.5" y2="480" stroke="#dde4e8"/><rect x="57" y="91" width="11.5" height="42.3" fill="#f2b65d" stroke="#a57425"/><text x="64" y="112" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:600;fill:#7a4a12">head 7 / block 0</text><text x="251.0" y="504" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#17384a">execution: 2,304 query slots x 2,176 keys</text><text x="251.0" y="526" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#5b7180">model submatrix: 2,160 x 2,160; tails in grey</text><text x="251.0" y="548" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#7a4a12">orange: head 7 / CTA 0 / first key tile</text><rect x="560" y="90" width="610" height="96" rx="9" fill="#e9efff" stroke="#5a6fa4" stroke-width="1.5"/><text x="572" y="114" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">One CTA = 256 queries for one head</text><text x="572" y="136" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">4 warps x 64 queries</text><text x="572" y="155" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">each warp = 4 M16 query tiles</text><text x="572" y="174" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">blockIdx.x = head, blockIdx.y = 256-query block</text><rect x="560" y="206" width="610" height="58" rx="9" fill="#fff0d6" stroke="#a57425" stroke-width="1.5"/><text x="572" y="230" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:600;fill:#17384a">warp 0: queries 0..63 of this CTA</text><text x="572" y="252" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">M16 tiles 0..3; q17 is warp 0, tile 1</text><rect x="560" y="270" width="610" height="58" rx="9" fill="#e4f4ed" stroke="#247666" stroke-width="1.5"/><text x="572" y="294" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:600;fill:#17384a">warp 1: queries 64..127 of this CTA</text><text x="572" y="316" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">M16 tiles 4..7</text><rect x="560" y="334" width="610" height="58" rx="9" fill="#e4f4ed" stroke="#247666" stroke-width="1.5"/><text x="572" y="358" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:600;fill:#17384a">warp 2: queries 128..191 of this CTA</text><text x="572" y="380" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">M16 tiles 8..11</text><rect x="560" y="398" width="610" height="58" rx="9" fill="#e4f4ed" stroke="#247666" stroke-width="1.5"/><text x="572" y="422" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:600;fill:#17384a">warp 3: queries 192..255 of this CTA</text><text x="572" y="444" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">M16 tiles 12..15</text><line x1="865" y1="186" x2="865" y2="206" stroke="#536a79" stroke-width="2.1" stroke-linecap="round"/><polygon points="865,206 870.0,195.0 860.0,195.0" fill="#536a79"/><rect x="560" y="474" width="610" height="172" rx="9" fill="#fff0d6" stroke="#a57425" stroke-width="1.5"/><text x="572" y="498" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">Two matched K/V stages (64 keys each)</text><text x="572" y="520" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">stage bytes = 2048 x 1 = 2,048 B per K or V slot</text><text x="572" y="539" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">K0 2,048 + V0 2,048 + K1 2,048 + V1 2,048 + 2 x 8 B barriers</text><text x="572" y="558" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">total shared = 8,208 B per CTA</text><text x="572" y="577" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">slot parity alternates; parity is not a readiness test</text><text x="572" y="596" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">FP8 reads 136 groups; upstream QKV group 135 is zero.</text><text x="572" y="615" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">Rows 2,160..2,175 are stored then cleared in the FP8 output.</text><text x="28" y="680" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:16px;font-weight:600;fill:#17384a">Why the key axis streams: the per-query FP32 numerator must survive all keys, while each 64-key score/E tile is short-lived.</text><text x="28" y="706" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#476273">The design assigns Q and u/D to register fragments. Compiler allocation and spills are checked separately in section 6.</text><text x="28" y="730" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#476273">Streaming keys bounds the short-lived score tile to 64 words per lane; that tile is not persistent across key steps.</text><text x="28" y="756" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#7a2f22">Last CTA: 112 model queries. FP8 rows 2,160..2,175 store then clear; rows 2,176..2,303 execute but skip stores.</text></svg>
