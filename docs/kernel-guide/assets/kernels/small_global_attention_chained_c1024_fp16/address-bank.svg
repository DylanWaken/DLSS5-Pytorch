<?xml version="1.0" encoding="UTF-8"?>
<svg data-kernel="small_global_attention_chained_c1024_fp16" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="fig-small_global_attention_chained_c1024_fp16-address-bank-title fig-small_global_attention_chained_c1024_fp16-address-bank-desc" style="min-width:1100px;width:1200px;height:auto"><title id="fig-small_global_attention_chained_c1024_fp16-address-bank-title">Exact Q, K and transposed-V addresses plus shared-bank starts</title><desc id="fig-small_global_attention_chained_c1024_fp16-address-bank-desc">Address equations and worked values for Q, K and transposed V, plus a 32-bank strip showing the lane-4 and lane-17 vector starts and the four-bank footprint.</desc><text x="28" y="30" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:21px;font-weight:600;fill:#17384a">Exact Q/K/V address maps and shared-bank geometry</text><text x="28" y="53" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#476273">A 16-byte lane vector is four consecutive 32-bit words. bankword = (byte address / 4) % 32.</text><rect x="28" y="86" width="370" height="214" rx="9" fill="#e9efff" stroke="#5a6fa4" stroke-width="1.5"/><text x="40" y="110" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">Q: direct global -&gt; registers</text><text x="40" y="132" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">group * 16384*E + head * 512*E</text><text x="40" y="151" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">+ chunk * 512 + lane * 16</text><text x="40" y="170" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">E=2: group stride 32,768; head 1,024</text><text x="40" y="189" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">E=1: group stride 16,384; head 512</text><text x="40" y="208" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">q17/head7/chunk0/lane4:</text><text x="40" y="227" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">  40,000 B vector base</text><rect x="414" y="86" width="370" height="214" rx="9" fill="#e9efff" stroke="#5a6fa4" stroke-width="1.5"/><text x="426" y="110" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">K: bulk global -&gt; shared</text><text x="426" y="132" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">group * 16384*E + head * 512*E</text><text x="426" y="151" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">+ keyChunk * 512</text><text x="426" y="170" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">group = keyTile*4 + CopySlot/QueryChunks</text><text x="426" y="189" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">same group/head stride as Q</text><text x="426" y="208" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">no transpose; 512 B copy unit</text><text x="426" y="227" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">q17 keyTile 0, head 7:</text><text x="426" y="246" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">  7,168 B group base</text><rect x="800" y="86" width="370" height="214" rx="9" fill="#fff0d6" stroke="#a57425" stroke-width="1.5"/><text x="812" y="110" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">V: transposed producer panels</text><text x="812" y="132" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">group * 32768 + head * 1024</text><text x="812" y="151" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">+ (CopySlot &amp; 1) * 512</text><text x="812" y="170" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">FP16 group = 16 tokens</text><text x="812" y="189" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">FP8 group = 32 tokens (two M16)</text><text x="812" y="208" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">head plane = 1,024 B in both</text><text x="812" y="227" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">not a dense token x channel array</text><text x="28" y="326" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#7a2f22">Q and K share a group/head stride that depends on E. V does not: its 32,768-byte group and 1,024-byte head plane are byte-identical across precisions,</text><text x="28" y="348" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#7a2f22">because the producer transposes 8x8 fragments and changes how many tokens share the 32,768 bytes (16 for FP16, 32 for FP8).</text><text x="28" y="396" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">Bank start for a 16 B lane vector in K or V shared panels (Q bypasses shared): 4 x lane mod 32. Lane 4 starts at bank 16; lane 17 at bank 4.</text><rect x="28" y="414" width="33" height="34" fill="#eef2f5" stroke="#ffffff"/><text x="44" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">0</text><rect x="63" y="414" width="33" height="34" fill="#eef2f5" stroke="#ffffff"/><text x="79" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">1</text><rect x="98" y="414" width="33" height="34" fill="#eef2f5" stroke="#ffffff"/><text x="114" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">2</text><rect x="133" y="414" width="33" height="34" fill="#eef2f5" stroke="#ffffff"/><text x="149" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">3</text><rect x="168" y="414" width="33" height="34" fill="#b9d9ff" stroke="#ffffff"/><text x="184" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">4</text><rect x="203" y="414" width="33" height="34" fill="#b9d9ff" stroke="#ffffff"/><text x="219" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">5</text><rect x="238" y="414" width="33" height="34" fill="#b9d9ff" stroke="#ffffff"/><text x="254" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">6</text><rect x="273" y="414" width="33" height="34" fill="#b9d9ff" stroke="#ffffff"/><text x="289" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">7</text><rect x="308" y="414" width="33" height="34" fill="#eef2f5" stroke="#ffffff"/><text x="324" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">8</text><rect x="343" y="414" width="33" height="34" fill="#eef2f5" stroke="#ffffff"/><text x="359" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">9</text><rect x="378" y="414" width="33" height="34" fill="#eef2f5" stroke="#ffffff"/><text x="394" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">10</text><rect x="413" y="414" width="33" height="34" fill="#eef2f5" stroke="#ffffff"/><text x="429" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">11</text><rect x="448" y="414" width="33" height="34" fill="#eef2f5" stroke="#ffffff"/><text x="464" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">12</text><rect x="483" y="414" width="33" height="34" fill="#eef2f5" stroke="#ffffff"/><text x="499" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">13</text><rect x="518" y="414" width="33" height="34" fill="#eef2f5" stroke="#ffffff"/><text x="534" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">14</text><rect x="553" y="414" width="33" height="34" fill="#eef2f5" stroke="#ffffff"/><text x="569" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">15</text><rect x="588" y="414" width="33" height="34" fill="#edaa44" stroke="#ffffff"/><text x="604" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">16</text><rect x="623" y="414" width="33" height="34" fill="#edaa44" stroke="#ffffff"/><text x="639" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">17</text><rect x="658" y="414" width="33" height="34" fill="#edaa44" stroke="#ffffff"/><text x="674" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">18</text><rect x="693" y="414" width="33" height="34" fill="#edaa44" stroke="#ffffff"/><text x="709" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">19</text><rect x="728" y="414" width="33" height="34" fill="#eef2f5" stroke="#ffffff"/><text x="744" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">20</text><rect x="763" y="414" width="33" height="34" fill="#eef2f5" stroke="#ffffff"/><text x="779" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">21</text><rect x="798" y="414" width="33" height="34" fill="#eef2f5" stroke="#ffffff"/><text x="814" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">22</text><rect x="833" y="414" width="33" height="34" fill="#eef2f5" stroke="#ffffff"/><text x="849" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">23</text><rect x="868" y="414" width="33" height="34" fill="#eef2f5" stroke="#ffffff"/><text x="884" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">24</text><rect x="903" y="414" width="33" height="34" fill="#eef2f5" stroke="#ffffff"/><text x="919" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">25</text><rect x="938" y="414" width="33" height="34" fill="#eef2f5" stroke="#ffffff"/><text x="954" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">26</text><rect x="973" y="414" width="33" height="34" fill="#eef2f5" stroke="#ffffff"/><text x="989" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">27</text><rect x="1008" y="414" width="33" height="34" fill="#eef2f5" stroke="#ffffff"/><text x="1024" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">28</text><rect x="1043" y="414" width="33" height="34" fill="#eef2f5" stroke="#ffffff"/><text x="1059" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">29</text><rect x="1078" y="414" width="33" height="34" fill="#eef2f5" stroke="#ffffff"/><text x="1094" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">30</text><rect x="1113" y="414" width="33" height="34" fill="#eef2f5" stroke="#ffffff"/><text x="1129" y="436" text-anchor="middle" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">31</text><text x="28" y="472" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#5b7180">orange: lane 4 vector at bank 16; blue: lane 17 vector at bank 4. A 16 B vector touches four banks and wraps at bank 31.</text><rect x="28" y="500" width="555" height="190" rx="9" fill="#e4f4ed" stroke="#247666" stroke-width="1.5"/><text x="40" y="524" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">Shared panel address inside one stage</text><text x="40" y="546" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">s_Base = stage*4,096 + lane*16</text><text x="40" y="565" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">K vector = s_Base + (columnTile*QueryChunks + chunk)*512</text><text x="40" y="584" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">V vector = s_ValueOffset + s_Base + (chunk*2 + columnTile)*512</text><text x="40" y="603" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">512 B is 128 words = 4 full bank cycles, so it preserves the lane start bank</text><text x="40" y="622" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">No XOR swizzle is applied in this kernel.</text><rect x="608" y="500" width="562" height="190" rx="9" fill="#ffe6e0" stroke="#a95847" stroke-width="1.5"/><text x="620" y="524" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">What the bank map does and does not prove</text><text x="620" y="546" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">The source exposes 16 B/lane loads and 512 B panels.</text><text x="620" y="565" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">A 32-lane ideal request repeats each bank four times.</text><text x="620" y="584" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">We do not label that repetition a conflict.</text><text x="620" y="603" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">The source does not expose a transaction split.</text><text x="620" y="622" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">128 B subtransactions were not verified in SASS.</text><text x="620" y="641" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">Only the shared-bank-conflict counter can establish cost.</text><text x="28" y="716" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#476273">Q is read with __ldca into register fragments; K and V are bulk-copied into s_Storage and then read as uint4. Those are separate storage layers.</text><text x="28" y="738" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#476273">Hardware-managed L1/L2 may serve global traffic. The 512-byte shared panel is explicitly addressed; it is not a cache and not a promise of residency.</text></svg>
