<?xml version="1.0" encoding="UTF-8"?>
<svg data-kernel="small_global_attention_chained_c1024_fp16" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-labelledby="fig-small_global_attention_chained_c1024_fp16-overview-title fig-small_global_attention_chained_c1024_fp16-overview-desc" style="min-width:1100px;width:1200px;height:auto"><title id="fig-small_global_attention_chained_c1024_fp16-overview-title">Small31 global attention: logical graph and the FP32 accumulation boundary</title><desc id="fig-small_global_attention_chained_c1024_fp16-overview-desc">The per-head attention graph with Q, K, transposed V, Half scores, the fixed positive exponent surrogate E, the FP32 unnormalised numerator u, the FP32 row denominator and the single publication rounding.</desc><text x="28" y="30" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:21px;font-weight:600;fill:#17384a">One head of global attention: the operation and the accumulation boundary</text><text x="28" y="53" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#476273">T = 2,160 model positions; key stream padded to 2,176. 32 heads, 32 channels per head. Values shown are source-derived.</text><rect x="28" y="78" width="265" height="102" rx="9" fill="#e9efff" stroke="#5a6fa4" stroke-width="1.5"/><text x="40" y="102" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">Q read rows [2160, 32]</text><text x="40" y="124" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">head-normalised, then scaled</text><text x="40" y="143" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">2 x 16 B / M16 tile / lane</text><text x="40" y="162" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">loaded once, retained</text><rect x="318" y="78" width="265" height="102" rx="9" fill="#e9efff" stroke="#5a6fa4" stroke-width="1.5"/><text x="330" y="102" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">K read rows [2160, 32]</text><text x="330" y="124" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">normalised per head</text><text x="330" y="143" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">streamed in 64-key tiles</text><text x="330" y="162" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">bulk copy to shared</text><rect x="608" y="78" width="265" height="102" rx="9" fill="#fff0d6" stroke="#a57425" stroke-width="1.5"/><text x="620" y="102" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">V read rows [2160, 32]</text><text x="620" y="124" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">not unit-bounded</text><text x="620" y="143" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">transposed in the QKV producer</text><text x="620" y="162" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">transposed panels in shared</text><rect x="898" y="78" width="274" height="102" rx="9" fill="#eef2f5" stroke="#6b7f8c" stroke-width="1.5"/><text x="910" y="102" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">Per-head problem</text><text x="910" y="124" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">2,160 model queries x 2,160 model keys</text><text x="910" y="143" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">one CTA head at blockIdx.x</text><text x="910" y="162" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">nine 256-query blocks</text><rect x="120" y="232" width="300" height="112" rx="9" fill="#e9efff" stroke="#5a6fa4" stroke-width="1.5"/><text x="132" y="256" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">QK^T scores (Half)</text><text x="132" y="278" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">half C/D in both precisions</text><text x="132" y="297" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">mma f16.f16.f16.f16</text><text x="132" y="316" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">eight N8 groups per M16 row</text><rect x="450" y="232" width="300" height="112" rx="9" fill="#ffe6e0" stroke="#a95847" stroke-width="1.5"/><text x="462" y="256" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">E = packed Half surrogate</text><text x="462" y="278" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">affine -&gt; clamp -&gt; word shift</text><text x="462" y="297" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">positive: 0.0040283203125 .. 1.640625</text><text x="462" y="316" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">E(score 0) = 0.083984375</text><text x="462" y="335" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">not row-max softmax</text><rect x="790" y="232" width="382" height="112" rx="9" fill="#fff0d6" stroke="#a57425" stroke-width="1.5"/><text x="802" y="256" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">Unnormalised prefix u</text><text x="802" y="278" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">u = sum over keys of P x V</text><text x="802" y="297" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">64 FP32 values per lane, persistent</text><text x="802" y="316" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">PV mma f32.f16.f16.f32</text><text x="802" y="335" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">P = Half E; D sums the same Half E</text><line x1="160" y1="180" x2="200" y2="232" stroke="#536a79" stroke-width="2.1" stroke-linecap="round"/><polygon points="200,232 197.3,220.2 189.3,226.3" fill="#536a79"/><line x1="450" y1="180" x2="390" y2="232" stroke="#536a79" stroke-width="2.1" stroke-linecap="round"/><polygon points="390,232 401.6,228.6 395.0,221.0" fill="#536a79"/><line x1="420" y1="288" x2="450" y2="288" stroke="#536a79" stroke-width="2.1" stroke-linecap="round"/><polygon points="450,288 439.0,283.0 439.0,293.0" fill="#536a79"/><line x1="750" y1="288" x2="790" y2="288" stroke="#536a79" stroke-width="2.1" stroke-linecap="round"/><polygon points="790,288 779.0,283.0 779.0,293.0" fill="#536a79"/><line x1="740" y1="180" x2="840" y2="232" stroke="#536a79" stroke-width="2.1" stroke-linecap="round"/><polygon points="840,232 832.5,222.5 827.9,231.4" fill="#536a79"/><rect x="450" y="390" width="300" height="118" rx="9" fill="#e4f4ed" stroke="#247666" stroke-width="1.5"/><text x="462" y="414" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">Row denominator D</text><text x="462" y="436" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">sum of the same Half E terms</text><text x="462" y="455" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">2 FP32 values per lane</text><text x="462" y="474" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">no Half tile total</text><text x="462" y="493" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">warp transpose, then FP32 carry</text><line x1="600" y1="344" x2="600" y2="390" stroke="#536a79" stroke-width="2.1" stroke-linecap="round"/><polygon points="600,390 605.0,379.0 595.0,379.0" fill="#536a79"/><rect x="790" y="390" width="382" height="118" rx="9" fill="#e4f4ed" stroke="#247666" stroke-width="1.5"/><text x="802" y="414" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">Publish y = u / D</text><text x="802" y="436" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">FP32 clamp and reciprocal</text><text x="802" y="455" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">one FP32 multiply</text><text x="802" y="474" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">one Half round (PackFloatColumnsHalf2)</text><text x="802" y="493" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">packed Half vector publication</text><line x1="1172" y1="288" x2="1172" y2="390" stroke="#536a79" stroke-width="2.1" stroke-linecap="round"/><polygon points="1172,390 1177.0,379.0 1167.0,379.0" fill="#536a79"/><line x1="750" y1="449" x2="790" y2="449" stroke="#536a79" stroke-width="2.1" stroke-linecap="round"/><polygon points="790,449 779.0,444.0 779.0,454.0" fill="#536a79"/><rect x="28" y="390" width="382" height="118" rx="9" fill="#eef2f5" stroke="#6b7f8c" stroke-width="1.5"/><text x="40" y="414" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:600;fill:#17384a">Invariant: same model operation</text><text x="40" y="436" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">same Q, K, V and token addresses</text><text x="40" y="455" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">same padded-key obligation</text><text x="40" y="474" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">P operand and D input: original Half E</text><text x="40" y="493" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:13px;font-weight:400;fill:#284653">only the finite-precision sum differs</text><text x="28" y="544" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:400;fill:#7a2f22">Forward invariant: every key prefix of u must fit the accumulator. A finite final value does not repair an earlier overflow.</text><text x="28" y="568" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:400;fill:#476273">FP16/FP8 QK scores are Half. Only the PV numerator and the whole row reduction are FP32 in these additive entries.</text><text x="28" y="592" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:15px;font-weight:400;fill:#476273">FP16 numerator and denominator use the same positive Half E weights; widening protects their unnormalised prefixes.</text><text x="28" y="616" text-anchor="start" style="font-family:Segoe UI,Segoe UI Variable,sans-serif;font-size:14px;font-weight:400;fill:#476273">Read extents above are not allocation capacity: the host reserves 2,176 rows. Shared staging is explicit; L1/L2 are hardware-managed.</text></svg>
