<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">FP16 deployment versus original extracted kernels</title>
<desc id="desc">Four measured resolutions on RTX PRO 6000 Blackwell. All per-order median ratios are within the accepted one-percent slowdown limit.</desc>
<rect width="1120" height="560" rx="20" fill="#f6f8fc"/>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172a43}.muted{fill:#52647c}</style>
<text x="42" y="48" font-size="26" font-weight="700">FP16 deployment: original vs reconstructed</text>
<text x="42" y="77" font-size="15" class="muted">Prepared-feature trunk, blocks 1-69 | SM120 | batch 1 | lower latency is better</text>
<rect x="42" y="99" width="16" height="16" fill="#7893b5"/><text x="67" y="113" font-size="14">Original extracted kernels</text>
<rect x="295" y="99" width="16" height="16" fill="#127e89"/><text x="320" y="113" font-size="14">CUDA/C++ reconstruction</text>
<text x="42" y="171" font-size="19" font-weight="600">720p</text>
<text x="42" y="192" font-size="12" class="muted">1280 x 720</text>
<rect x="188" y="155" width="199.82" height="21" rx="4" fill="#7893b5"/>
<text x="397.82" y="171" font-size="14">3.700 ms</text>
<rect x="188" y="182" width="195.15" height="21" rx="4" fill="#127e89"/>
<text x="393.15" y="198" font-size="14">3.614 ms</text>
<text x="1000" y="184" text-anchor="middle" font-size="18" font-weight="600">-2.34%</text>
<text x="42" y="256" font-size="19" font-weight="600">1080p</text>
<text x="42" y="277" font-size="12" class="muted">1920 x 1080</text>
<rect x="188" y="240" width="239.45" height="21" rx="4" fill="#7893b5"/>
<text x="437.45" y="256" font-size="14">4.434 ms</text>
<rect x="188" y="267" width="234.41" height="21" rx="4" fill="#127e89"/>
<text x="432.41" y="283" font-size="14">4.341 ms</text>
<text x="1000" y="269" text-anchor="middle" font-size="18" font-weight="600">-2.11%</text>
<text x="42" y="341" font-size="19" font-weight="600">2K</text>
<text x="42" y="362" font-size="12" class="muted">2560 x 1440</text>
<rect x="188" y="325" width="325.57" height="21" rx="4" fill="#7893b5"/>
<text x="523.57" y="341" font-size="14">6.029 ms</text>
<rect x="188" y="352" width="325.56" height="21" rx="4" fill="#127e89"/>
<text x="523.56" y="368" font-size="14">6.029 ms</text>
<text x="1000" y="354" text-anchor="middle" font-size="18" font-weight="600">-0.01%</text>
<text x="42" y="426" font-size="19" font-weight="600">4K</text>
<text x="42" y="447" font-size="12" class="muted">3840 x 2160</text>
<rect x="188" y="410" width="610.26" height="21" rx="4" fill="#7893b5"/>
<text x="808.26" y="426" font-size="14">11.301 ms</text>
<rect x="188" y="437" width="616.11" height="21" rx="4" fill="#127e89"/>
<text x="814.11" y="453" font-size="14">11.409 ms</text>
<text x="1000" y="439" text-anchor="middle" font-size="18" font-weight="600">+0.96%</text>
<text x="42" y="512" font-size="14" class="muted">64 alternating pairs; medians from resident CUDA graphs. Both execution orders pass at every resolution.</text>
<text x="42" y="537" font-size="13" class="muted">Excludes input/output stages and DLL host work. Source data: fp16_deployment_measurements.json.</text>
</svg>
