<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="945" viewBox="0 0 1440 945" role="img" aria-labelledby="title desc">
<title id="title">Global attention · blocks 31–38</title><desc id="desc">C1024 · 32 heads × 32 channels · all bottleneck tokens attend globally · no local relative-bias table in this branch</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1440" height="100%" fill="#ffffff"/>
<text x="42" y="45" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="650" text-anchor="start">Global attention · blocks 31–38</text>
<text x="42" y="77" fill="#52647c" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">C1024 · 32 heads × 32 channels · all bottleneck tokens attend globally · no local relative-bias table in this branch</text>
<text x="44" y="128" fill="#7750aa" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start">Prepare the global token sequence</text>
<rect x="44" y="147" width="320.0" height="126" rx="12" fill="#f3eefb" stroke="#7750aa" stroke-width="1.5"/>
<text x="59" y="176" fill="#7750aa" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" text-anchor="start">QKV: 1024 → 3072</text>
<text x="59" y="201" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Split 32 heads × Q/K/V</text>
<text x="59" y="223" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Q and K: L2 normalize</text>
<path d="M 364.0,210.0 L 388.0,210.0" fill="none" stroke="#52647c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="388.0" y="147" width="320.0" height="126" rx="12" fill="#f3eefb" stroke="#7750aa" stroke-width="1.5"/>
<text x="403.0" y="176" fill="#7750aa" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" text-anchor="start">Scale and flatten</text>
<text x="403.0" y="201" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Q *= √32 × head_scale</text>
<text x="403.0" y="223" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Flatten H × W = T tokens</text>
<text x="403.0" y="245" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Publish working values</text>
<path d="M 708.0,210.0 L 732.0,210.0" fill="none" stroke="#52647c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="732.0" y="147" width="320.0" height="126" rx="12" fill="#f3eefb" stroke="#7750aa" stroke-width="1.5"/>
<text x="747.0" y="176" fill="#7750aa" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" text-anchor="start">Pad keys and values</text>
<text x="747.0" y="201" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">P = ceil(T / 64) × 64</text>
<text x="747.0" y="223" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Zero-pad K and V to P</text>
<text x="747.0" y="245" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Q keeps T rows</text>
<path d="M 1052.0,210.0 L 1076.0,210.0" fill="none" stroke="#52647c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1076.0" y="147" width="320.0" height="126" rx="12" fill="#f3eefb" stroke="#7750aa" stroke-width="1.5"/>
<text x="1091.0" y="176" fill="#7750aa" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" text-anchor="start">Global scores</text>
<text x="1091.0" y="201" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Q × Kᵀ</text>
<text x="1091.0" y="223" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">[B, 32, T, P]</text>
<text x="1091.0" y="245" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">4K: T=2160, P=2176</text>
<text x="44" y="377" fill="#7750aa" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start">Normalize with explicit padded-key correction</text>
<rect x="44" y="396" width="320.0" height="126" rx="12" fill="#f3eefb" stroke="#7750aa" stroke-width="1.5"/>
<text x="59" y="425" fill="#7750aa" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" text-anchor="start">Exponential E</text>
<text x="59" y="450" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Use exp_global(scores)</text>
<text x="59" y="472" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Global constants differ</text>
<text x="59" y="494" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">from local-window constants</text>
<path d="M 364.0,459.0 L 388.0,459.0" fill="none" stroke="#52647c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="388.0" y="396" width="320.0" height="126" rx="12" fill="#f3eefb" stroke="#7750aa" stroke-width="1.5"/>
<text x="403.0" y="425" fill="#7750aa" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" text-anchor="start">Denominator D</text>
<text x="403.0" y="450" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Sum E in 64-key chunks</text>
<text x="403.0" y="472" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">FP32 running total</text>
<text x="403.0" y="494" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Subtract (P−T) × exp_global(0)</text>
<path d="M 708.0,459.0 L 732.0,459.0" fill="none" stroke="#52647c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="732.0" y="396" width="320.0" height="126" rx="12" fill="#f3eefb" stroke="#7750aa" stroke-width="1.5"/>
<text x="747.0" y="425" fill="#7750aa" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" text-anchor="start">Weighted value sum</text>
<text x="747.0" y="450" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">publish(E) × padded V</text>
<text x="747.0" y="472" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Padded V entries are zero</text>
<text x="747.0" y="494" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">No value correction needed</text>
<path d="M 1052.0,459.0 L 1076.0,459.0" fill="none" stroke="#52647c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1076.0" y="396" width="320.0" height="126" rx="12" fill="#f3eefb" stroke="#7750aa" stroke-width="1.5"/>
<text x="1091.0" y="425" fill="#7750aa" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" text-anchor="start">Normalize + restore</text>
<text x="1091.0" y="450" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Multiply output by 1 / D</text>
<text x="1091.0" y="472" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Publish and restore [B,H,W,C]</text>
<text x="1091.0" y="494" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Then enclosing projection</text>
<path d="M 1220,273 L 1407,273 L 1407,330 L 24,330 L 24,459 L 44,459" fill="none" stroke="#7750aa" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="44" y="620" width="654" height="166" rx="12" fill="#fff5e5" stroke="#b86910" stroke-width="1.5"/>
<text x="59" y="649" fill="#b86910" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" text-anchor="start">Why the correction matters</text>
<text x="59" y="674" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Zero-padded K produces a zero dot product, but exp_global(0) is nonzero.</text>
<text x="59" y="696" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Subtract its contribution from the denominator so padding does not dilute</text>
<text x="59" y="718" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">the normalized result.</text>
<rect x="728" y="620" width="668" height="166" rx="12" fill="#f1f4f8" stroke="#52647c" stroke-width="1.5"/>
<text x="743" y="649" fill="#52647c" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" text-anchor="start">Why training uses more memory</text>
<text x="743" y="674" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">The eager Torch graph explicitly materializes score and exponential tensors.</text>
<text x="743" y="696" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">The reconstructed CUDA route uses its own tiled physical schedule; logical</text>
<text x="743" y="718" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">boxes do not imply these full allocations.</text>
<text x="44" y="840" fill="#52647c" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">This diagram describes the implemented floating training arithmetic. It is not a substitution with a standard softmax/SDPA operator.</text>
<text x="44" y="883" fill="#52647c" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Source: NRBlock.attend (C1024 branch), Numerics.exp(global_mode=True), sum64, matmul and reciprocal.</text>
<text x="44" y="925" fill="#52647c" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">DLSSNR-PyTorch · implemented logical graph · source and shape ledger: architecture/source-map.json</text>
</svg>
