<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1240" viewBox="0 0 1200 1240" role="img" aria-labelledby="title desc">
<title id="title">Encoder: one tail, two distinct paths</title><desc id="desc">H × W × C notation · pool the raw tail; retain its published value for the decoder</desc>
<defs><marker id="arrow-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563ab"/></marker><marker id="arrow-tensor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087f80"/></marker><marker id="arrow-skip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b86910"/></marker><marker id="arrow-attention" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7750aa"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#52647c"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="32" y="40" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600" text-anchor="start">Encoder: one tail, two distinct paths</text>
<text x="32" y="70" fill="#52647c" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">H × W × C notation · pool the raw tail; retain its published value for the decoder</text>
<rect x="35" y="130" width="260" height="89" rx="4" fill="#f0fbf8" stroke="#087f80" stroke-width="1.7"/>
<text x="165.0" y="157" fill="#087f80" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Level input</text>
<text x="165.0" y="181" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">H × W × C</text>
<text x="165.0" y="204" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">Example: 272 × 480 × 128</text>
<rect x="355" y="130" width="340" height="89" rx="13" fill="#edf5ff" stroke="#2563ab" stroke-width="1.7"/>
<text x="525.0" y="157" fill="#2563ab" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Leading window blocks</text>
<text x="525.0" y="181" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">Branched FFN → Window attention</text>
<text x="525.0" y="204" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">C128 example: blocks 9–13</text>
<rect x="760" y="130" width="405" height="89" rx="13" fill="#edf5ff" stroke="#2563ab" stroke-width="1.7"/>
<text x="962.5" y="157" fill="#2563ab" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Tail window block</text>
<text x="962.5" y="181" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">Branched FFN → Window attention</text>
<text x="962.5" y="204" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">C128 example: block 14</text>
<path d="M 295,174.5 L 355,174.5" fill="none" stroke="#2563ab" stroke-width="2" marker-end="url(#arrow-flow)"/>
<path d="M 695,174.5 L 760,174.5" fill="none" stroke="#2563ab" stroke-width="2" marker-end="url(#arrow-flow)"/>
<rect x="790" y="280" width="360" height="89" rx="4" fill="#f0fbf8" stroke="#087f80" stroke-width="1.7"/>
<text x="970.0" y="307" fill="#087f80" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Raw tail R</text>
<text x="970.0" y="331" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">H × W × C</text>
<text x="970.0" y="354" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">Before output publication</text>
<path d="M 962.5,219 L 970.0,280" fill="none" stroke="#2563ab" stroke-width="2" marker-end="url(#arrow-flow)"/>
<rect x="350" y="430" width="325" height="66" rx="13" fill="#fff5e5" stroke="#b86910" stroke-width="1.7"/>
<text x="512.5" y="457" fill="#b86910" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Publish R</text>
<text x="512.5" y="481" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">Working-precision boundary</text>
<rect x="790" y="430" width="360" height="89" rx="13" fill="#edf5ff" stroke="#2563ab" stroke-width="1.7"/>
<text x="970.0" y="457" fill="#2563ab" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">2 × 2 mean pool</text>
<text x="970.0" y="481" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">H/2 × W/2 × C</text>
<text x="970.0" y="504" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">136 × 240 × 128 in example</text>
<path d="M 970.0,369 L 970,398 L 512.5,398 L 512.5,430" fill="none" stroke="#b86910" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-skip)"/>
<path d="M 970.0,369 L 970.0,430" fill="none" stroke="#2563ab" stroke-width="2" marker-end="url(#arrow-flow)"/>
<rect x="350" y="580" width="325" height="89" rx="4" fill="#f0fbf8" stroke="#087f80" stroke-width="1.7"/>
<text x="512.5" y="607" fill="#087f80" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Saved encoder skip</text>
<text x="512.5" y="631" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">H × W × C</text>
<text x="512.5" y="654" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">Example: block 14 → 56</text>
<path d="M 512.5,496 L 512.5,580" fill="none" stroke="#b86910" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-skip)"/>
<rect x="790" y="580" width="360" height="89" rx="13" fill="#edf5ff" stroke="#2563ab" stroke-width="1.7"/>
<text x="970.0" y="607" fill="#2563ab" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Pad to next field</text>
<text x="970.0" y="631" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">H′ × W′ × C</text>
<text x="970.0" y="654" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">H′, W′ = align4(ceil(size/2))</text>
<path d="M 970.0,519 L 970.0,580" fill="none" stroke="#2563ab" stroke-width="2" marker-end="url(#arrow-flow)"/>
<rect x="790" y="730" width="360" height="89" rx="13" fill="#edf5ff" stroke="#2563ab" stroke-width="1.7"/>
<text x="970.0" y="757" fill="#2563ab" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Channel projection C → 2C</text>
<text x="970.0" y="781" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">Learned per-pixel matrix</text>
<text x="970.0" y="804" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">H′ × W′ × 2C</text>
<path d="M 970.0,669 L 970.0,730" fill="none" stroke="#2563ab" stroke-width="2" marker-end="url(#arrow-flow)"/>
<text x="803" y="706" fill="#2563ab" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Publish pooled values</text>
<rect x="790" y="880" width="360" height="89" rx="13" fill="#edf5ff" stroke="#2563ab" stroke-width="1.7"/>
<text x="970.0" y="907" fill="#2563ab" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Publish projected state</text>
<text x="970.0" y="931" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">Next encoder level</text>
<text x="970.0" y="954" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">136 × 240 × 256 in example</text>
<path d="M 970.0,819 L 970.0,880" fill="none" stroke="#2563ab" stroke-width="2" marker-end="url(#arrow-flow)"/>
<text x="35" y="750" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start">Same dependency at all five levels</text>
<text x="35" y="787" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">Encoder blocks</text>
<text x="200" y="787" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">C</text>
<text x="295" y="787" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">Saved skip →</text>
<text x="500" y="787" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">Next C</text>
<text x="35" y="822" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">1–4</text>
<text x="200" y="822" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">32</text>
<text x="295" y="822" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">4 → 66</text>
<text x="500" y="822" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">64</text>
<text x="35" y="857" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">5–8</text>
<text x="200" y="857" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">64</text>
<text x="295" y="857" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">8 → 62</text>
<text x="500" y="857" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">128</text>
<text x="35" y="892" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">9–14</text>
<text x="200" y="892" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">128</text>
<text x="295" y="892" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">14 → 56</text>
<text x="500" y="892" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">256</text>
<text x="35" y="927" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">15–22</text>
<text x="200" y="927" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">256</text>
<text x="295" y="927" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">22 → 48</text>
<text x="500" y="927" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">512</text>
<text x="35" y="962" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">23–30</text>
<text x="200" y="962" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">512</text>
<text x="295" y="962" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">30 → 39</text>
<text x="500" y="962" fill="#172b45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">1024</text>
<text x="35" y="1030" fill="#52647c" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">FFN variants by C: 32 Dense; 64 / 128 / 256 Branched; 512 Grouped. All use Window attention.</text>
<text x="35" y="1054" fill="#52647c" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">4K C128 tail: 272 × 480 × 128 → pool 136 × 240 × 128 → project 136 × 240 × 256.</text>
<text x="35" y="1078" fill="#52647c" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">The retained skip keeps the high-resolution field, before pooling and channel projection.</text>
<text x="35" y="1140" fill="#52647c" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Pool averages in FP32, casts back, pads, then publishes. The projection is published again.</text>
<text x="35" y="1164" fill="#52647c" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Source: DLSSNR._encoder_stage, Numerics.pool and Geometry.levels.</text>
<text x="32" y="1221" fill="#52647c" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">Logical tensor flow · shapes omit batch unless shown · operations may be fused in CUDA</text>
</svg>
