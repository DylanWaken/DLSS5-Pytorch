<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">FP8 semantic CUDA deployment versus original kernels</title>
<desc id="desc">Measured 720p, 1080p, 1440p and 4K latency on RTX PRO 6000 Blackwell. The 1% gate has not passed at every size.</desc>
<rect width="1120" height="560" rx="20" fill="#f6f8fc"/>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172a43}.muted{fill:#52647c}</style>
<text x="42" y="48" font-size="26" font-weight="700">FP8 deployment: original vs readable CUDA</text>
<text x="42" y="77" font-size="15" class="muted">Prepared-feature trunk, blocks 1–69 | SM120 | batch 1 | lower latency is better</text>
<rect x="42" y="99" width="16" height="16" fill="#7893b5"/><text x="67" y="113" font-size="14">Original extracted kernels</text>
<rect x="295" y="99" width="16" height="16" fill="#127e89"/><text x="320" y="113" font-size="14">CUDA/C++ reconstruction</text>
<text x="42" y="171" font-size="19" font-weight="600">720p</text>
<text x="42" y="192" font-size="12" class="muted">1280 × 720</text>
<rect x="188" y="155" width="221.57" height="21" rx="4" fill="#7893b5"/>
<text x="419.57" y="171" font-size="14">2.199 ms</text>
<rect x="188" y="182" width="221.83" height="21" rx="4" fill="#127e89"/>
<text x="419.83" y="198" font-size="14">2.202 ms</text>
<text x="1015" y="184" text-anchor="middle" font-size="18" font-weight="600">+0.01%</text>
<text x="42" y="256" font-size="19" font-weight="600">1080p</text>
<text x="42" y="277" font-size="12" class="muted">1920 × 1080</text>
<rect x="188" y="240" width="259.09" height="21" rx="4" fill="#7893b5"/>
<text x="457.09" y="256" font-size="14">2.572 ms</text>
<rect x="188" y="267" width="262.03" height="21" rx="4" fill="#127e89"/>
<text x="460.03" y="283" font-size="14">2.601 ms</text>
<text x="1015" y="269" text-anchor="middle" font-size="18" font-weight="600">+1.18%</text>
<text x="42" y="341" font-size="19" font-weight="600">2K / 1440p</text>
<text x="42" y="362" font-size="12" class="muted">2560 × 1440</text>
<rect x="188" y="325" width="357.99" height="21" rx="4" fill="#7893b5"/>
<text x="555.99" y="341" font-size="14">3.553 ms</text>
<rect x="188" y="352" width="355.45" height="21" rx="4" fill="#127e89"/>
<text x="553.45" y="368" font-size="14">3.528 ms</text>
<text x="1015" y="354" text-anchor="middle" font-size="18" font-weight="600">-0.78%</text>
<text x="42" y="426" font-size="19" font-weight="600">4K</text>
<text x="42" y="447" font-size="12" class="muted">3840 × 2160</text>
<rect x="188" y="410" width="670.00" height="21" rx="4" fill="#7893b5"/>
<text x="868.00" y="426" font-size="14">6.650 ms</text>
<rect x="188" y="437" width="657.70" height="21" rx="4" fill="#127e89"/>
<text x="855.70" y="453" font-size="14">6.528 ms</text>
<text x="1015" y="439" text-anchor="middle" font-size="18" font-weight="600">-1.73%</text>
<text x="42" y="512" font-size="14" class="muted">64 alternating pairs; paired-ratio medians. The 1% gate has not passed at every size.</text>
<text x="42" y="537" font-size="13" class="muted">Excludes input/output stages and DLL host work. Recorded CUDA-event timings on SM120.</text>
</svg>
